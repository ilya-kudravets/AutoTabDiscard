<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head>
<body class="options">
  <main><h1>Tab Hibernator settings</h1>
  <p>It wakes only when a tab is due to hibernate—no background polling.</p>
  <form id="form">
    <label>Hibernate after
      <select id="idlePreset"><option value="1">1 minute</option><option value="5" selected>5 minutes</option><option value="custom">Custom</option></select>
      <input id="idleMinutes" type="number" min="1" max="1440" required aria-label="Custom minutes">
    </label>
    <label><input id="discardPinned" type="checkbox"> Allow pinned tabs to hibernate</label>
    <label><input id="discardAudio" type="checkbox"> Allow tabs playing audio/video to hibernate (needed for YouTube)</label>
    <p>Paused YouTube videos are not specially protected. With the option above enabled, the tab will hibernate once the timer expires.</p>
    <label>Protected domains (one per line)<textarea id="whitelist" rows="7" placeholder="mail.google.com&#10;docs.example.com"></textarea></label>
    <button class="primary">Save settings</button><span id="saved" role="status"></span>
  </form></main><script src="options.js"></script>
</body></html>
