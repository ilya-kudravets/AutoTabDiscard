name: Build and release Chrome extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read extension version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          assert manifest["manifest_version"] == 3
          assert manifest["background"]["service_worker"] == "background.js"
          assert "content_scripts" not in manifest
          print("Manifest v3 is valid:", manifest["name"], manifest["version"])
          PY

      - name: Run minimal tests
        run: node --test tests/manifest.test.mjs

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/tab-hibernator.zip" . \
            -x ".git/*" ".github/*" "dist/*" "content.js" "tests/*.test.mjs"

      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: tab-hibernator
          path: dist/tab-hibernator.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: tab-hibernator
          path: dist

      - name: Create or update versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/tab-hibernator.zip --clobber
          else
            gh release create "$tag" dist/tab-hibernator.zip \
              --title "Tab Hibernator $tag" --generate-notes
          fi
